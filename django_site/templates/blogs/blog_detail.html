{% extends "base.html" %}
{% block content %}

<section class="blog-detail">

    <h1>{{ blog.title }}</h1>

    {% if blog.cover_image %}
    <img src="{{ blog.cover_image.url }}" class="blog-detail-cover">
    {% endif %}

    <article class="blog-content">
        {{ blog.content|linebreaks }}
    </article>

</section>

{% endblock %}
